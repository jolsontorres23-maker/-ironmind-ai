<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><link rel="manifest" href="manifest.json"><title>IRONMIND AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}header{padding:16px;border-bottom:1px solid #293341;position:sticky;top:0;background:#0b0f14;z-index:3}main{max-width:900px;margin:auto;padding:16px 16px 90px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0}.tabs button,button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#f59e0b;color:#111}.tabs button{background:#151b23;color:#9aa6b2;border:1px solid #293341}.tabs .active{background:#f59e0b;color:#111}.card,.hero{background:#151b23;border:1px solid #293341;border-radius:18px;padding:16px;margin:12px 0}.hero{background:#1c2530}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#1c2530;border-radius:13px;padding:12px}.stat b{display:block;font-size:20px}.muted{color:#9aa6b2;font-size:13px}.exercise{border-top:1px solid #293341;padding:14px 0}.row{display:flex;justify-content:space-between;gap:10px}.check{width:22px;height:22px}.progress{height:9px;background:#252d36;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#f59e0b}.hidden{display:none}input,select,textarea{width:100%;background:#0e141b;border:1px solid #293341;color:#fff;border-radius:10px;padding:10px;margin-top:5px}label{font-size:13px;color:#9aa6b2}.badge{font-size:11px;background:#2a3440;border-radius:99px;padding:4px 7px}.secondary{background:#1c2530;color:#fff;border:1px solid #293341}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.sets input{margin:0}.hidden{display:none}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><b>IRONMIND AI</b> <span class="badge">ADVANCED BODYBUILDING</span></header><main><div class="tabs"><button class="active" onclick="show('today',this)">Today</button><button onclick="show('week',this)">Week</button><button onclick="show('coach',this)">AI Coach</button><button onclick="show('profile',this)">Profile</button></div>
<section id="today"><div class="hero"><small class="muted">TODAY'S SESSION</small><h1 id="title"></h1><p id="focus" class="muted"></p><button onclick="finish()">Finish Workout</button></div><div class="grid" id="stats"></div><div class="card"><div class="row"><b>Progress</b><span id="pct" class="muted">0%</span></div><div class="progress"><div id="bar" style="width:0"></div></div></div><div class="card"><h3>Exercises</h3><div id="ex"></div></div><div class="card"><h3>Cardio</h3><div id="cardio"></div></div></section>
<section id="week" class="hidden"><h1>Weekly Plan</h1><div id="weeklist"></div></section>
<section id="coach" class="hidden"><h1>AI Coach</h1><div class="card"><p class="muted">Log performance, sleep, soreness or pain. The coach adjusts volume, intensity and cardio.</p><textarea id="msg" rows="5" placeholder="Bench 225 x 8/8/7. Slept 6 hours. Left shoulder tight."></textarea><button onclick="coach()">Analyze</button></div><div class="card" id="answer"><p class="muted">Your recommendation will appear here.</p></div></section>
<section id="profile" class="hidden"><h1>Athlete Profile</h1><div class="card"><div class="grid"><label>Height (in)<input id="height" type="number"></label><label>Weight (lb)<input id="weight" type="number"></label><label>Goal Weight<input id="goal" type="number"></label><label>Training Age<input id="age" type="number"></label></div><br><button onclick="saveProfile()">Save</button></div><div class="card"><h3>Cardio Engine</h3><p id="engine" class="muted"></p></div></section></main>
<script>
const plan=[['MONDAY','Push A','Chest • Delts • Triceps',[['Barbell Bench Press',4,'6-8','RIR 2'],['Incline DB Press',3,'8-10','RIR 1-2'],['Machine Chest Press',3,'10-12','RIR 1'],['Cable Fly',3,'12-15','RIR 1'],['Seated DB Shoulder Press',3,'8-10','RIR 2'],['Cable Lateral Raise',4,'12-20','RIR 0-2'],['Overhead Triceps Extension',3,'10-15','RIR 1'],['Rope Pressdown',3,'12-15','RIR 0-1']]],['TUESDAY','Pull A','Back • Rear Delts • Biceps',[['Weighted Pull-Up',4,'6-8','RIR 2'],['Chest-Supported Row',4,'8-10','RIR 1-2'],['Lat Pulldown',3,'10-12','RIR 1'],['Cable Row',3,'10-12','RIR 1'],['Reverse Pec Deck',4,'12-20','RIR 0-2'],['EZ-Bar Curl',3,'8-12','RIR 1'],['Incline DB Curl',3,'10-15','RIR 0-1'],['Hammer Curl',2,'12-15','RIR 0-1']]],['WEDNESDAY','Legs A','Quads • Hamstrings • Calves',[['High-Bar Squat',4,'5-8','RIR 2'],['Hack Squat',3,'8-12','RIR 1-2'],['Leg Press',3,'10-15','RIR 1'],['Leg Extension',3,'12-20','RIR 0-1'],['Romanian Deadlift',3,'8-10','RIR 2'],['Seated Leg Curl',3,'10-15','RIR 1'],['Standing Calf Raise',4,'8-15','RIR 1']]],['THURSDAY','Push B','Upper Chest • Delts • Triceps',[['Incline Barbell Press',4,'6-8','RIR 2'],['Flat DB Press',3,'8-12','RIR 1'],['Machine Press',3,'10-15','RIR 1'],['Cable Fly',3,'12-15','RIR 0-1'],['Machine Shoulder Press',3,'8-12','RIR 1-2'],['DB Lateral Raise',4,'12-20','RIR 0-1'],['Skull Crusher',3,'8-12','RIR 1'],['Single-Arm Pressdown',3,'12-15','RIR 0-1']]],['FRIDAY','Pull B','Lats • Upper Back • Arms',[['Barbell Row',4,'6-8','RIR 2'],['Neutral Pulldown',3,'8-12','RIR 1'],['Machine High Row',3,'8-12','RIR 1'],['Straight-Arm Pulldown',3,'12-15','RIR 1'],['Cable Rear Delt Fly',4,'12-20','RIR 0-2'],['Preacher Curl',3,'8-12','RIR 1'],['Cable Curl',3,'12-15','RIR 0-1'],['Rope Hammer Curl',2,'12-15','RIR 0-1']]],['SATURDAY','Legs B','Glutes • Hamstrings • Quads • Calves',[['Romanian Deadlift',4,'6-8','RIR 2'],['Front Squat',3,'6-10','RIR 2'],['Bulgarian Split Squat',3,'8-12','RIR 1'],['Lying Leg Curl',4,'10-15','RIR 1'],['Leg Extension',3,'12-20','RIR 0-1'],['Hip Thrust',3,'8-12','RIR 1'],['Seated Calf Raise',4,'10-20','RIR 0-1']]],['SUNDAY','Recovery','Zone 2 • Core • Mobility',[['Cable Crunch',3,'12-20','RIR 1'],['Hanging Knee Raise',3,'10-15','RIR 1'],['Back Extension',2,'12-15','RIR 2']]]];
let s=JSON.parse(localStorage.ironmind||'null')||{height:68,weight:246,goal:200,age:5,done:{},logs:{}};function save(){localStorage.ironmind=JSON.stringify(s)}function idx(){return(new Date().getDay()+6)%7}function cardio(){let bmi=s.weight/((s.height*.0254)**2);return bmi>=30?35:30}
function render(){let d=plan[idx()],total=d[3].length,done=s.done[idx()]||0;title.textContent=d[1];focus.textContent=d[2];stats.innerHTML=`<div class=stat><small class=muted>Weight</small><b>${s.weight} lb</b></div><div class=stat><small class=muted>Goal</small><b>${s.goal} lb</b></div><div class=stat><small class=muted>Exercises</small><b>${total}</b></div><div class=stat><small class=muted>Sets</small><b>${d[3].reduce((a,x)=>a+x[1],0)}</b></div>`;ex.innerHTML=d[3].map((x,i)=>`<div class=exercise><div class=row><div><b>${i+1}. ${x[0]}</b><div class=muted>${x[1]} sets • ${x[2]} reps • ${x[3]}</div></div><input class=check type=checkbox ${i<done?'checked':''} onchange="mark(${i},this.checked)"></div><div class=sets>${Array.from({length:Math.min(4,x[1])},(_,z)=>`<input placeholder="lb" value="${s.logs[idx()+'-'+i+'-'+z]||''}" onchange="logSet(${idx()},${i},${z},this.value)">`).join('')}</div></div>`).join('');let c=cardio();document.getElementById('cardio').innerHTML=`<b>${c} min Zone 2</b><p class=muted>Incline treadmill, bike, elliptical or StairMaster. Keep it conversational. Target 8,000–12,000 steps/day.</p>`;pct.textContent=Math.round(done/total*100)+'%';bar.style.width=(done/total*100)+'%';weeklist.innerHTML=plan.map(d=>`<div class=card><b>${d[0]} • ${d[1]}</b><p class=muted>${d[2]} • ${d[3].reduce((a,x)=>a+x[1],0)} sets</p></div>`).join('');height.value=s.height;weight.value=s.weight;goal.value=s.goal;age.value=s.age;engine.textContent=`Starting prescription: ${c} minutes Zone 2. Adjust based on recovery and performance, not bodyweight alone.`}
function mark(i,on){s.done[idx()]=on?Math.max(s.done[idx()]||0,i+1):Math.max(0,i);save();render()}function logSet(d,e,z,v){s.logs[d+'-'+e+'-'+z]=v;save()}function finish(){s.done[idx()]=plan[idx()][3].length;save();render();alert('Workout saved.')}function saveProfile(){s.height=+height.value;s.weight=+weight.value;s.goal=+goal.value;s.age=+age.value;save();render();alert('Profile saved.')}
function coach(){let m=msg.value.toLowerCase(),a=[];if(/pain|hurt|shoulder|knee|back|elbow/.test(m))a.push('Pain flag: do not push through sharp or worsening pain. Swap the aggravating movement for a pain-free variation.');if(/tired|sleep|fatigue|sore/.test(m))a.push('Recovery flag: keep compounds at RIR 2–3 and remove one isolation set from the most fatigued area.');if(/strong|easy|great/.test(m))a.push('Performance flag: if the top of the rep range was clean, add 2.5–5% next exposure.');if(!a.length)a.push('Baseline: compounds RIR 1–3, isolations RIR 0–2. Progress load after the top of the rep range is achieved cleanly.');a.push(`Cardio baseline: ${cardio()} minutes Zone 2 plus 8,000–12,000 steps.`);answer.innerHTML='<h3>Coach recommendation</h3>'+a.map(x=>`<p>${x}</p>`).join('')}
function show(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}render();</script></body></html>
